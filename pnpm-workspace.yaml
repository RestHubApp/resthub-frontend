# Configuración de pnpm. No declara `packages`: el repositorio es un solo
# proyecto, no un espacio de trabajo. Desde pnpm 11 los ajustes ya no se leen
# del campo `pnpm` de package.json, así que este archivo es el único lugar donde
# pueden vivir.

allowBuilds:
  # Resolutor nativo que usa eslint-import-resolver-typescript para seguir
  # importaciones sin extensión. Sin su compilación, los límites de arquitectura
  # no resuelven módulos y las reglas quedan inertes.
  unrs-resolver: true
  # Observador de archivos de jest-haste-map: trae binarios precompilados y
  # solo lo usa `jest --watch`. Su script de compilación no hace falta.
  '@parcel/watcher': false
  # Pact (pruebas de contrato): el binario nativo llega precompilado en
  # @pact-foundation/pact-core-linux-x64-glibc y su script `install` está vacío.
  # @scarf/scarf solo envía estadísticas de instalación.
  '@pact-foundation/pact-core': false
  '@scarf/scarf': false
  # msw: su postinstall solo copia el worker del navegador (mockServiceWorker.js);
  # las pruebas usan msw/node y no lo necesitan.
  msw: false

minimumReleaseAgeExclude:
  - '@types/node@22.20.2 || 24.13.4'
  - '@types/react-dom@19.3.0'
  - '@types/react@19.3.0'
  - lint-staged@17.5.1
  - proxy-addr@2.0.8
  - react-dom@19.3.0
  - react@19.3.0
  - scheduler@0.28.0
  - source-map-js@1.2.2
  - vite@8.3.0
  - zod@4.6.1

# Avisos de seguridad en dependencias transitivas de las herramientas de
# desarrollo (eslint, jest, workbox, pact, postcss), que no llegan al navegador.
overrides:
  # GHSA-qhr7-859c-m2p7, el de parseCommaParts y GHSA-q2hr-2g5m-vwhr: cada rama
  # mayor a su versión corregida.
  brace-expansion@<1.1.21: 1.1.21
  brace-expansion@>=2.0.0 <2.1.7: 2.1.7
  brace-expansion@>=4.0.0 <5.0.12: 5.0.12
  # GHSA-q8mj-m7cp-5q26, GHSA-x5fp-wj9c-mxmx y GHSA-4mjr-xmp4-gh2g: qs de
  # typed-rest-client, en Stryker (pruebas de mutación).
  qs@>=2.2.5 <6.16.0: 6.16.0
  # GHSA-hrr3-gc8f-f4qj: fast-uri de ajv, en @hookform/resolvers y workbox-build.
  # @hookform/resolvers solo usa ajv con su resolutor de ajv, que la app no importa.
  fast-uri@>=3.0.0 <3.1.8: 3.1.8
  # GHSA-j6r3-76f7-8jcv y GHSA-h3mg-xc3c-68pw: ip-address de socks y
  # express-rate-limit, en la CLI de shadcn.
  ip-address@<10.7.1: 10.7.1
  # GHSA-5r4p-p66f-jhc7: hono del SDK de MCP, en la CLI de shadcn.
  hono@>=4.12.4 <4.13.11: 4.13.11
  # GHSA-q3jh-wrc6-jgq8 y GHSA-8r9p-f939-6h3c (altos): follow-redirects de axios
  # y http-proxy, en Pact (pruebas de contrato).
  follow-redirects@>=1.16.0 <1.16.1: 1.16.1
  # GHSA-hp3w-g68c-fv3c: sprintf-js no tiene versión corregida y llega por
  # argparse 1 de js-yaml 3. js-yaml 4 ya no usa sprintf-js y conserva `load`, lo
  # único que llama load-nyc-config (la cobertura de Jest).
  '@istanbuljs/load-nyc-config>js-yaml': 4.3.2
  # GHSA-jqcg-44mw-7w3h (crítico): proxy-addr de express, en el servidor falso de
  # Pact y en el SDK de MCP que trae la CLI de shadcn.
  proxy-addr@>=1.1.0 <2.0.8: 2.0.8
  # GHSA-68fv-2mgg-jv7q (alto): source-map-js de postcss, solo al compilar.
  source-map-js@>=1.0.0 <1.2.2: 1.2.2
  # GHSA-8r5x-fm3f-whwj y el de la propiedad propia (críticos): handlebars de
  # eslint-plugin-boundaries, solo al correr el lint.
  handlebars@>=4.0.0 <4.7.10: 4.7.10
  # OAuth del SDK de MCP (alto): lo trae la CLI de shadcn, que no corre en la app.
  '@modelcontextprotocol/sdk@<1.31.0': 1.31.0
  # GHSA-xjj6-f33q-929c y GHSA-27r3-jxmh-p828 (altos): undici de la CLI de shadcn
  # (también por @shadcn/registry y @dotenvx/dotenvx), que no corre en la app.
  undici@>=7.18.0 <7.30.1: 7.30.1
  # Denegación de servicio con bytes de más tras un cuerpo comprimido (alto):
  # body-parser de express, en el servidor falso de Pact y en el SDK de MCP.
  body-parser@>=2.0.0 <2.4.0: 2.4.0

auditConfig:
  ignoreGhsas:
    # braces <=3.0.3 todavía no tiene versión corregida. Solo lo usan micromatch
    # y fast-glob dentro de eslint-plugin-boundaries, eslint-plugin-check-file y
    # la CLI de shadcn, sobre patrones del propio repositorio. Quitar en cuanto
    # salga la corrección.
    # Excepción hasta 2026-11-04, ver SECURITY.md.
    - GHSA-vfj7-8cjw-p6xm
