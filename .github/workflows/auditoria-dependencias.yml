# Auditoría programada de dependencias (ASVS V15.2.1, ver SECURITY.md).
#
# El job `frontend` de ci.yml corre `pnpm audit` en cada push y PR; este repite la
# misma revisión cada lunes aunque nadie toque el código, para que una vulnerabilidad
# publicada después del último push no pase desconocida. Si falla, GitHub avisa del
# fallo y empieza a correr el plazo de remediación de su severidad. Una excepción
# (`auditConfig.ignoreGhsas` en pnpm-workspace.yaml) vale para los dos y lleva su
# fecha en SECURITY.md.
name: Auditoría de dependencias

on:
  schedule:
    # Lunes 08:17 UTC (03:17 en Lima), fuera de la hora en punto.
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  pnpm-audit:
    name: pnpm audit sobre pnpm-lock.yaml
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Igual que en ci.yml: lee pnpm-lock.yaml, no hace falta instalar.
      - name: pnpm audit
        run: pnpm audit --audit-level high
