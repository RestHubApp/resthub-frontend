# Accesibilidad automática de las pantallas sin sesión (acceso, acceso de
# plataforma y vista previa sin código) y, en el job `con-sesion`, de todas las
# pantallas y modales de cada rol, con axe-core sobre el build de producción y el
# backend de develop con su semilla (la revisión de `pnpm a11y`, ver la cabecera
# de checks/accessibility/all.mjs). Fallan ante una violación serious o critical.
name: Accesibilidad

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  axe:
    name: axe-core (pantallas sin sesión)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Instalar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium de Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Compilar
        run: pnpm build

      - name: axe-core sobre las pantallas sin sesión
        env:
          A11Y_ONLY: acceso,raiz,plataforma-acceso,vista-previa-sin-codigo
          A11Y_STRICT: '1'
        run: |
          pnpm preview --port 5202 --strictPort &
          until curl -sf http://localhost:5202/acceso > /dev/null; do sleep 1; done
          node checks/accessibility/axe.mjs

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: axe-sin-sesion
          path: checks/accessibility/reports/axe/

  # El mismo recorrido que `pnpm a11y axe keyboard` en local: cada ruta y cada
  # modal del inventario, con la cuenta de su rol, en escritorio y en celular.
  # Lighthouse y WAVE no corren aquí: miden rendimiento y usan una extensión.
  con-sesion:
    name: axe-core (pantallas con sesión)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_BACKEND_DIR: resthub-backend
      E2E_DB: ${{ github.workspace }}/.e2e/a11y.db
      E2E_BACKEND_PORT: '8202'
      E2E_FRONT_ORIGIN: http://localhost:5202
      # Sesenta días de historia sintética: el panel de indicadores tiene gráficos que medir.
      E2E_SEED_HISTORY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Entorno (backend, dependencias y base sembrada)
        uses: ./.github/actions/entorno-e2e

      - name: Instalar Chromium de Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Compilar contra el backend de pruebas
        env:
          VITE_API_URL: http://localhost:8202
        run: pnpm exec vite build --outDir dist-a11y

      - name: axe-core y teclado sobre todas las pantallas
        env:
          E2E_DB_PREPARED: '1'
          A11Y_STRICT: '1'
        run: |
          # Al terminar se cierran el backend y la vista previa: si `uv run` sigue
          # vivo, retiene la caché de uv y su limpieza final agota el tiempo.
          trap 'kill $(jobs -p) 2>/dev/null; wait 2>/dev/null' EXIT
          bash e2e/server/backend.sh &
          pnpm exec vite preview --outDir dist-a11y --port 5202 --strictPort &
          until curl -sf http://localhost:8202/api/v1/health > /dev/null; do sleep 1; done
          until curl -sf http://localhost:5202/acceso > /dev/null; do sleep 1; done
          pnpm a11y axe keyboard

      - name: Guardar los reportes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axe-con-sesion
          path: |
            checks/accessibility/reports/axe/
            checks/accessibility/reports/teclado/
            checks/accessibility/reports/datos.json
            checks/accessibility/reports/summary.md
          retention-days: 14
