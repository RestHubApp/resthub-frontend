# Accesibilidad automática de las pantallas sin sesión (acceso, acceso de
# plataforma y vista previa sin código) y, en el job `con-sesion`, de todas las
# pantallas y modales de cada rol, con axe-core sobre el build de producción y el
# backend de develop con su semilla (la revisión de `pnpm a11y`, ver la cabecera
# de checks/accessibility/all.mjs). Fallan ante una violación serious o critical.
name: Accesibilidad

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Dentro de un contenedor, `run` usa `sh -e` en vez de `bash -eo pipefail`: sin
# esto, una tubería que falla pasa por buena y la trampa EXIT de dash cambia el
# código de salida del paso.
defaults:
  run:
    shell: bash

jobs:
  axe:
    name: axe-core (pantallas sin sesión)
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Navegadores de la imagen
        uses: ./.github/actions/navegadores-imagen

      - name: Compilar
        run: pnpm build

      - name: axe-core sobre las pantallas sin sesión
        env:
          A11Y_ONLY: acceso,raiz,plataforma-acceso,vista-previa-sin-codigo
          A11Y_STRICT: '1'
        run: |
          pnpm preview --port 5202 --strictPort &
          until curl -sf http://localhost:5202/acceso > /dev/null; do sleep 1; done
          node checks/accessibility/axe.mjs

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axe-sin-sesion
          path: checks/accessibility/reports/axe/

  # El mismo recorrido que `pnpm a11y axe keyboard` en local: cada ruta y cada
  # modal del inventario, con la cuenta de su rol, en escritorio y en celular.
  # Lighthouse y WAVE no corren aquí: miden rendimiento y usan una extensión.
  # En una sola máquina tardaba unos 11 minutos: axe se reparte en cuatro
  # (A11Y_SHARD, ver checks/accessibility/common.mjs) y la revisión de teclado,
  # que dura menos de un minuto, va en la primera.
  con-sesion:
    name: axe-core (pantallas con sesión, parte ${{ matrix.parte }} de 4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4]
    env:
      E2E_BACKEND_DIR: resthub-backend
      E2E_DB: ${{ github.workspace }}/.e2e/a11y.db
      E2E_BACKEND_PORT: '8202'
      E2E_FRONT_ORIGIN: http://localhost:5202
      # Sesenta días de historia sintética: el panel de indicadores tiene gráficos que medir.
      E2E_SEED_HISTORY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Entorno (backend, dependencias y base sembrada)
        uses: ./.github/actions/entorno-e2e

      - name: Navegadores de la imagen
        uses: ./.github/actions/navegadores-imagen

      - name: Compilar contra el backend de pruebas
        env:
          VITE_API_URL: http://localhost:8202
        run: pnpm exec vite build --outDir dist-a11y

      - name: axe-core${{ matrix.parte == 1 && ' y teclado' || '' }} sobre su parte de las pantallas
        env:
          E2E_DB_PREPARED: '1'
          A11Y_STRICT: '1'
          A11Y_SHARD: ${{ matrix.parte }}/4
        run: |
          # Al terminar se cierran el backend y la vista previa: si `uv run` sigue
          # vivo, retiene la caché de uv y su limpieza final agota el tiempo.
          trap 'kill $(jobs -p) 2>/dev/null; wait 2>/dev/null' EXIT
          bash e2e/server/backend.sh &
          pnpm exec vite preview --outDir dist-a11y --port 5202 --strictPort &
          until curl -sf http://localhost:8202/api/v1/health > /dev/null; do sleep 1; done
          until curl -sf http://localhost:5202/acceso > /dev/null; do sleep 1; done
          pnpm a11y axe ${{ matrix.parte == 1 && 'keyboard' || '' }}

      - name: Guardar los reportes
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: axe-con-sesion-parte-${{ matrix.parte }}
          path: |
            checks/accessibility/reports/axe/
            checks/accessibility/reports/teclado/
            checks/accessibility/reports/datos.json
            checks/accessibility/reports/summary.md
          retention-days: 14

  # El nombre de siempre, para la protección de la rama: falla si alguna parte falló.
  con-sesion-resultado:
    name: axe-core (pantallas con sesión)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: con-sesion
    if: ${{ !cancelled() }}
    steps:
      - name: Las cuatro partes pasaron
        if: ${{ needs.con-sesion.result != 'success' }}
        run: |
          echo "::error::Alguna parte de axe con sesión falló (${{ needs.con-sesion.result }}): mira su job o su reporte."
          exit 1
