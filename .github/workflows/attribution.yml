# Falla si el título o la descripción del PR traen atribución de una
# herramienta de IA. Los textos llegan por variables de entorno y nunca se
# interpolan en el script.
name: Atribución

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, develop]

permissions:
  contents: read

jobs:
  no-attribution:
    name: Sin atribución de IA en el PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Revisar título y descripción
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! { printf '%s\n' "$PR_TITLE"; printf '%s\n' "$PR_BODY"; } | sh .husky/attribution.sh; then
            echo "::error::El título o la descripción del PR contienen atribución de una herramienta de IA. Quítala."
            exit 1
          fi
