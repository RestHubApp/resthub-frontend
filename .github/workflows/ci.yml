# Las mismas comprobaciones que corren en local. El hook de Git es una
# comodidad y se puede saltar con --no-verify; esto no.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      # Archivos, dependencias y exports que nadie usa.
      - name: Código sin uso (knip)
        run: pnpm knip

      # React Doctor: corrección, rendimiento, seguridad y accesibilidad de React.
      # `--no-score` no llama a su API de puntuación ni envía fallos; falla ante
      # cualquier hallazgo (advertencias incluidas). Las exclusiones y su motivo
      # están en doctor.config.jsonc.
      - name: React Doctor
        run: pnpm run doctor

      # Código repetido: falla si pasa del 0,5 % de las líneas.
      - name: Duplicación (jscpd)
        run: pnpm dup

      - name: Pruebas unitarias
        run: pnpm test

      - name: Verificación de tipos y compilación
        run: pnpm build

      # Porcentaje de expresiones con tipo conocido (sin any): no puede bajar de 99,7 %.
      - name: Cobertura de tipos
        run: pnpm type-coverage

      # Peso del paquete (gzip) contra el presupuesto del package.json; usa el dist del paso anterior.
      - name: Presupuesto de tamaño (size-limit)
        run: pnpm size

      # Dependencias con vulnerabilidades conocidas de severidad alta o crítica.
      - name: Auditoría de dependencias
        run: pnpm audit --audit-level high

  # Análisis estático con Semgrep y búsqueda de secretos en el historial con
  # gitleaks. ESLint security corre en el job de arriba. El detalle y los falsos
  # positivos revisados están en RestHub_Pruebas/07-seguridad/sast.md.
  security:
    name: Seguridad (Semgrep, gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks revisa el historial completo, no solo el último commit.
          fetch-depth: 0

      - name: Instalar uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - name: Semgrep
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: >
          uvx semgrep==1.178.0 scan --metrics=off --error
          --config p/typescript --config p/react --config p/javascript
          --config p/owasp-top-ten --config p/secrets --config p/jwt

      - name: gitleaks sobre el historial
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts=HEAD .
  # Pruebas de contrato del consumidor (Pact): las funciones reales de src/api
  # contra el servidor simulado de Pact. Generan el pact que el backend
  # verifica en su propio CI (tests/contract/pacts/ en resthub-backend).
  contract:
    name: Contrato con el backend (Pact, consumidor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Pruebas de contrato del consumidor
        run: pnpm test:contract

      - name: Guardar el pact generado
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pact-resthub-frontend-resthub-backend
          path: pacts/

      # Aviso, no bloqueo: el backend verifica la copia que versiona. Si el pact
      # cambió, esa copia hay que actualizarla en un PR del backend.
      - name: Comparar con la copia que verifica el backend
        env:
          BACKEND_PACT: https://raw.githubusercontent.com/RestHubApp/resthub-backend/develop/tests/contract/pacts/resthub-frontend-resthub-backend.json
        run: |
          if ! curl -fsSL "$BACKEND_PACT" -o /tmp/pact-backend.json; then
            echo "::warning::El backend todavía no versiona el pact en develop."
          elif ! diff -q /tmp/pact-backend.json pacts/resthub-frontend-resthub-backend.json; then
            echo "::warning::El pact cambió: copia pacts/resthub-frontend-resthub-backend.json a tests/contract/pacts/ del backend."
          fi

  # Tipos generados desde el OpenAPI del backend. Si el backend cambió un campo
  # que el frontend usa, `tsc -b` con los tipos regenerados falla en la pantalla
  # afectada; si solo cambió el esquema, schema.d.ts quedó desactualizado y el
  # diff lo señala.
  api-types:
    name: Tipos del API al día con el backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Traer el backend (develop)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: RestHubApp/resthub-backend
          ref: develop
          path: backend

      - name: Instalar uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: '3.13'

      - name: Exportar el OpenAPI del backend
        working-directory: backend
        env:
          DEBUG: 'true'
        run: uv run --no-dev python scripts/export_openapi.py "$GITHUB_WORKSPACE/openapi.json"

      - name: Instalar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Regenerar src/api/schema.d.ts
        run: pnpm exec openapi-typescript openapi.json -o src/api/schema.d.ts

      - name: Verificación de tipos con el contrato regenerado
        run: pnpm exec tsc -b

      - name: schema.d.ts versionado igual al regenerado
        if: success() || failure()
        run: git diff --exit-code -- src/api/schema.d.ts

  # Huella de carbono de la primera visita (Sustainable Web Design v4, el modelo
  # de websitecarbon.com): compila, sirve `dist` con `vite preview`, carga cada
  # ruta pública y la pantalla principal del mesero en Chromium con un contexto
  # nuevo, suma los bytes transferidos y falla si una ruta baja de la nota A+.
  # La sesión del mesero y las respuestas del API son de prueba (scripts/carbon).
  carbon:
    name: Huella de carbono (A+ en la primera visita)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Navegadores de la imagen
        uses: ./.github/actions/navegadores-imagen

      - name: Medir la primera visita de cada ruta
        run: pnpm carbon:browser --verbose --json carbon.json

      - name: Subir la medición
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: huella-de-carbono
          path: carbon.json
          retention-days: 14

  # Pruebas de extremo a extremo con Playwright (solo Chromium) contra el
  # backend de develop, con una base SQLite propia migrada y sembrada. La
  # regresión visual corre en el job `visual`, dentro de la imagen de Playwright.
  #
  # Se reparten en tres máquinas (`--shard`), cada una con su propio backend y su
  # propia base: así no compiten por la CPU ni por SQLite. El job `e2e-report`
  # junta sus reportes y es el que lleva el nombre «E2E (Playwright)».
  #
  # Corren dentro de la imagen oficial de Playwright, como `visual` y `carbon`: la
  # imagen ya trae Chromium y sus librerías, así que no se instala nada con `apt`
  # (el espejo de Ubuntu llegó a tardar diez minutos en dárselas). Su versión es la
  # exacta de `playwright` en package.json; si no, falla «Navegadores de la imagen».
  e2e:
    name: E2E (Playwright, parte ${{ matrix.shard }} de 3)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      E2E_BACKEND_DIR: resthub-backend
      E2E_DB: ${{ github.workspace }}/.e2e/e2e.db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Entorno (backend, dependencias y base sembrada)
        uses: ./.github/actions/entorno-e2e

      - name: Navegadores de la imagen
        uses: ./.github/actions/navegadores-imagen

      - name: Pruebas E2E (escritorio y celular a 390 px)
        env:
          E2E_DB_PREPARED: '1'
          E2E_BLOB_DIR: e2e/.blob
        run: pnpm test:e2e --shard=${{ matrix.shard }}/3

      - name: Subir la parte del reporte
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reporte-playwright-parte-${{ matrix.shard }}
          # Las carpetas empiezan con punto (e2e/.blob): sin esto, upload-artifact
          # las descarta como ocultas.
          include-hidden-files: true
          path: |
            e2e/.blob
            e2e/.report-coverage-ui.json
            e2e/.results
          retention-days: 14

  # Junta las tres partes en un solo reporte HTML y falla si alguna falló.
  e2e-report:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: e2e
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Bajar las partes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reporte-playwright-parte-*
          path: partes

      - name: Juntar el reporte HTML
        run: |
          mkdir -p blobs
          find partes -path '*/.blob/*.zip' -exec cp {} blobs/ \;
          ls blobs
          PLAYWRIGHT_HTML_OUTPUT_DIR=e2e/.report pnpm exec playwright merge-reports --reporter html blobs

      - name: Subir el reporte de Playwright
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reporte-playwright
          include-hidden-files: true
          path: e2e/.report
          retention-days: 14

      - name: Las tres partes pasaron
        if: ${{ needs.e2e.result != 'success' }}
        run: |
          echo "::error::Alguna parte de la E2E falló (${{ needs.e2e.result }}): mira su job o el reporte."
          exit 1

  # Regresión visual de Chromium (escritorio y celular) dentro de la imagen
  # oficial de Playwright, la misma con la que se generaron las líneas base
  # (`pnpm test:visual:update` y el workflow «Líneas base visuales»). La versión
  # de la imagen debe ser la exacta de `playwright` en package.json. Firefox y
  # WebKit se corren en local con `pnpm test:visual`.
  visual:
    name: Regresión visual (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    env:
      E2E_BACKEND_DIR: resthub-backend
      E2E_DB: ${{ github.workspace }}/.e2e/e2e.db
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Entorno (backend, dependencias y base sembrada)
        uses: ./.github/actions/entorno-e2e

      - name: Navegadores de la imagen
        uses: ./.github/actions/navegadores-imagen

      - name: Regresión visual
        env:
          E2E_DB_PREPARED: '1'
        run: pnpm test:visual:ci

      - name: Subir el reporte y las diferencias
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: regresion-visual
          include-hidden-files: true
          path: |
            e2e/.report
            e2e/.results
          retention-days: 14
