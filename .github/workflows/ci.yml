# Las mismas comprobaciones que corren en local. El hook de Git es una
# comodidad y se puede saltar con --no-verify; esto no.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Pruebas unitarias
        run: pnpm test

      - name: Verificación de tipos y compilación
        run: pnpm build

  # Pruebas de extremo a extremo con Playwright (solo Chromium) contra el
  # backend de develop, con una base SQLite propia migrada y sembrada. La
  # regresión visual no corre aquí: sus líneas base dependen del sistema
  # operativo (se corre en local con `pnpm test:visual`).
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      E2E_BACKEND_DIR: resthub-backend
      E2E_DB: ${{ github.workspace }}/.e2e/e2e.db
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Traer el backend (develop)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: RestHubApp/resthub-backend
          ref: develop
          path: resthub-backend

      - name: Instalar pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Instalar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          pnpm install --frozen-lockfile
          uv sync --frozen --directory resthub-backend

      - name: Migrar y sembrar la base de pruebas
        run: bash e2e/servidor/backend.sh --preparar

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Pruebas E2E (escritorio y celular a 390 px)
        env:
          E2E_DB_PREPARADA: '1'
        run: pnpm test:e2e

      - name: Subir el reporte de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: reporte-playwright
          path: |
            e2e/.reporte
            e2e/.reporte-cobertura-ui.json
            e2e/.resultados
          retention-days: 14
