# Las mismas comprobaciones que corren en local. El hook de Git es una
# comodidad y se puede saltar con --no-verify; esto no.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Instalar pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Instalar Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Pruebas unitarias
        run: pnpm test

      - name: Verificación de tipos y compilación
        run: pnpm build

      # Dependencias con vulnerabilidades conocidas de severidad alta o crítica.
      - name: Auditoría de dependencias
        run: pnpm audit --audit-level high

  # Análisis estático con Semgrep y búsqueda de secretos en el historial con
  # gitleaks. ESLint security corre en el job de arriba. El detalle y los falsos
  # positivos revisados están en RestHub_Pruebas/07-seguridad/sast.md.
  seguridad:
    name: Seguridad (Semgrep, gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # gitleaks revisa el historial completo, no solo el último commit.
          fetch-depth: 0

      - name: Instalar uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: Semgrep
        env:
          SEMGREP_SEND_METRICS: 'off'
        run: >
          uvx semgrep==1.178.0 scan --metrics=off --error
          --config p/typescript --config p/react --config p/javascript
          --config p/owasp-top-ten --config p/secrets --config p/jwt

      - name: gitleaks sobre el historial
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --log-opts=HEAD .
